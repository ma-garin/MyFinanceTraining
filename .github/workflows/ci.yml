name: CI (manual)

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: Playwright E2E も実行する
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: ${{ inputs.e2e }}
        run: npx playwright install --with-deps chromium
      - if: ${{ inputs.e2e }}
        run: npm run test:e2e
